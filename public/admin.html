<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelOne Staff Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23ff1493'>♪</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      color: #e0e0e0;
      min-height: 100vh;
    }

    .navbar {
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 20, 147, 0.2);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      color: #ff1493;
      font-size: 1.5rem;
    }

    .logout-btn {
      background: #ff1493;
      color: #fff;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #ff69b4;
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 20, 147, 0.2);
    }

    .tab-btn {
      padding: 1rem 1.5rem;
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 1rem;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #ff1493;
      border-bottom-color: #ff1493;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 20, 147, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .booking-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    .booking-info {
      display: grid;
      gap: 1rem;
    }

    .booking-info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(255, 20, 147, 0.1);
    }

    .booking-info-row .label {
      color: #aaa;
      font-size: 0.9rem;
    }

    .booking-info-row .value {
      font-weight: 500;
      font-family: monospace;
    }

    .proof-section {
      background: rgba(255, 20, 147, 0.1);
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
    }

    .proof-image {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      margin: 1rem 0;
      border: 1px solid rgba(255, 20, 147, 0.3);
    }

    .status-badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending {
      background: rgba(255, 152, 0, 0.2);
      color: #ffb74d;
    }

    .status-active {
      background: rgba(76, 175, 80, 0.2);
      color: #81c784;
    }

    .status-rejected {
      background: rgba(244, 67, 54, 0.2);
      color: #ef5350;
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: #4caf50;
      color: white;
      flex: 1;
    }

    .btn-primary:hover {
      background: #45a049;
    }

    .btn-danger {
      background: #f44336;
      color: white;
      flex: 1;
    }

    .btn-danger:hover {
      background: #da190b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .calendar-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }

    .room-column {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 20, 147, 0.15);
      border-radius: 8px;
      padding: 1rem;
    }

    .room-name {
      font-weight: bold;
      color: #ff1493;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 20, 147, 0.2);
    }

    .time-block {
      padding: 0.75rem;
      background: rgba(76, 175, 80, 0.15);
      border-left: 3px solid #4caf50;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .time-block .time {
      font-weight: bold;
      color: #81c784;
    }

    .time-block .customer {
      color: #aaa;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-form {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 20, 147, 0.2);
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 400px;
    }

    .login-form h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #ff1493;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid rgba(255, 20, 147, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ff1493;
      background: rgba(255, 255, 255, 0.15);
    }

    .login-form button {
      width: 100%;
      padding: 1rem;
      background: #ff1493;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
    }

    .login-form button:hover {
      background: #ff69b4;
    }

    .error-msg {
      color: #ef5350;
      text-align: center;
      margin-top: 1rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #aaa;
    }

    .empty-state p {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      text-decoration: none;
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 20, 147, 0.3);
      color: #fff;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 100px;
    }

    textarea:focus {
      outline: none;
      border-color: #ff1493;
      background: rgba(255, 255, 255, 0.15);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #0f0f1e;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      border: 1px solid rgba(255, 20, 147, 0.3);
    }

    .modal-close {
      float: right;
      font-size: 2rem;
      cursor: pointer;
      color: #aaa;
      background: none;
      border: none;
      width: auto;
      padding: 0;
    }

    .modal-close:hover {
      color: #fff;
    }

    .clearfix {
      clear: both;
    }

    @media (max-width: 768px) {
      .booking-card {
        grid-template-columns: 1fr;
      }

      .calendar-view {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 0 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginSection" class="login-container">
    <div class="login-form">
      <h2>🎤 LevelOne Staff</h2>
      <form onsubmit="login(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="admin">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit">Login</button>
        <div id="loginError" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardSection" style="display: none;">
    <div class="navbar">
      <div>
        <h1>🎤 LevelOne Staff Dashboard</h1>
        <p style="color: #aaa; margin-top: 0.25rem;">Welcome, <span id="staffName"></span></p>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')">
          ⏳ Pending Verification
        </button>
        <button class="tab-btn" onclick="switchTab('calendar')">
          📅 Calendar View
        </button>
      </div>

      <!-- Pending Bookings Tab -->
      <div id="pending" class="tab-content active">
        <div id="pendingBookings"></div>
      </div>

      <!-- Calendar Tab -->
      <div id="calendar" class="tab-content">
        <div id="calendarView"></div>
      </div>
    </div>
  </div>

  <!-- Reject Modal -->
  <div id="rejectModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeRejectModal()">×</button>
      <h3>Reject Booking</h3>
      <div style="margin-top: 1.5rem;">
        <label for="rejectReason">Reason for rejection:</label>
        <textarea id="rejectReason" placeholder="Payment mismatch, invalid screenshot, etc."></textarea>
        <div class="action-buttons" style="margin-top: 1.5rem;">
          <button class="btn-danger" onclick="confirmReject()">Reject Booking</button>
          <button style="background: #666; color: white;" onclick="closeRejectModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let authToken = localStorage.getItem('authToken');
    let currentStaffName = localStorage.getItem('staffName');
    let pendingBookings = [];
    let allBookings = [];
    let rejectingBookingId = null;

    // Initialize
    if (authToken) {
      showDashboard();
      loadPendingBookings();
      loadAllBookings();
    }

    function switchTab(tabName) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      // Show selected tab
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'calendar') {
        renderCalendarView();
      }
    }

    async function login(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/api/staff-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          throw new Error('Invalid credentials');
        }

        const data = await res.json();
        authToken = data.token;
        localStorage.setItem('authToken', authToken);
        localStorage.setItem('staffName', data.username);
        currentStaffName = data.username;

        showDashboard();
        loadPendingBookings();
        loadAllBookings();
      } catch (err) {
        document.getElementById('loginError').textContent = err.message;
      }
    }

    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('staffName');
      authToken = null;
      currentStaffName = null;
      document.getElementById('loginSection').style.display = 'flex';
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('loginError').textContent = '';
    }

    function showDashboard() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      document.getElementById('staffName').textContent = currentStaffName;
    }

    async function loadPendingBookings() {
      try {
        const res = await fetch(`${API_BASE}/api/staff/pending-bookings`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!res.ok) throw new Error('Failed to load');

        pendingBookings = await res.json();
        renderPendingBookings();
      } catch (err) {
        console.error(err);
      }
    }

    async function loadAllBookings() {
      try {
        const res = await fetch(`${API_BASE}/api/staff/all-bookings`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!res.ok) throw new Error('Failed to load');

        allBookings = await res.json();
      } catch (err) {
        console.error(err);
      }
    }

    function renderPendingBookings() {
      const container = document.getElementById('pendingBookings');

      if (pendingBookings.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>✓ No pending bookings</p><p style="font-size: 0.9rem; color: #666;">All bookings have been verified.</p></div>';
        return;
      }

      container.innerHTML = pendingBookings.map(booking => `
        <div class="card">
          <div class="booking-card">
            <div class="booking-info">
              <div class="booking-info-row">
                <span class="label">Booking ID</span>
                <span class="value">${booking.id}</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Status</span>
                <span class="status-badge status-pending">Pending</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Room</span>
                <span class="value">${booking.roomName}</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Date</span>
                <span class="value">${new Date(booking.startTime).toLocaleDateString()}</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Time</span>
                <span class="value">${new Date(booking.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${new Date(booking.endTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Customer</span>
                <span class="value">${booking.customerName}</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Email</span>
                <span class="value" style="font-size: 0.85rem;">${booking.customerEmail}</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Phone</span>
                <span class="value">${booking.customerPhone}</span>
              </div>
              <div class="booking-info-row">
                <span class="label">Amount</span>
                <span class="value" style="color: #81c784; font-size: 1.2rem;">₱${booking.totalAmount}</span>
              </div>
            </div>

            <div class="proof-section">
              <p style="margin-bottom: 1rem;"><strong>Payment Proof Screenshot</strong></p>
              ${booking.screenshotPath ? `
                <img src="/${booking.screenshotPath}" alt="Payment proof" class="proof-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 200%22%3E%3Crect fill=%22%23333%22 width=%22300%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-family=%22monospace%22%3EImage Not Found%3C/text%3E%3C/svg%3E'">
              ` : '<p style="color: #aaa;">No image available</p>'}
              
              <div class="action-buttons">
                <button class="btn-primary" onclick="verifyBooking('${booking.id}')">✓ Verify & Activate</button>
                <button class="btn-danger" onclick="openRejectModal('${booking.id}')">✗ Reject</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderCalendarView() {
      const container = document.getElementById('calendarView');
      
      const rooms = ['room_purple', 'room_romance', 'room_moonlight'];
      const roomNames = {
        'room_purple': 'Purple Rain',
        'room_romance': 'Bad Romance',
        'room_moonlight': 'Moonlight Blue'
      };

      container.innerHTML = '<div class="calendar-view">' + rooms.map(roomId => {
        const bookings = allBookings.filter(b => b.roomId === roomId);
        
        return `
          <div class="room-column">
            <div class="room-name">${roomNames[roomId]}</div>
            ${bookings.length === 0 ? '<p style="color: #666; font-size: 0.9rem;">No bookings</p>' : ''}
            ${bookings.map(b => `
              <div class="time-block">
                <div class="time">${new Date(b.startTime).toLocaleDateString()} ${new Date(b.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                <div class="customer">👤 ${b.customerName}</div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('') + '</div>';
    }

    async function verifyBooking(bookingId) {
      if (!confirm('Verify and activate this booking?')) return;

      try {
        const res = await fetch(`${API_BASE}/api/staff/verify-booking/${bookingId}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ notes: 'Verified by staff' })
        });

        if (!res.ok) throw new Error('Verification failed');

        alert('✓ Booking verified and activated');
        loadPendingBookings();
        loadAllBookings();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    function openRejectModal(bookingId) {
      rejectingBookingId = bookingId;
      document.getElementById('rejectModal').classList.add('active');
      document.getElementById('rejectReason').value = '';
    }

    function closeRejectModal() {
      document.getElementById('rejectModal').classList.remove('active');
      rejectingBookingId = null;
    }

    async function confirmReject() {
      const reason = document.getElementById('rejectReason').value.trim();

      if (!reason) {
        alert('Please provide a reason');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/staff/reject-booking/${rejectingBookingId}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ reason })
        });

        if (!res.ok) throw new Error('Rejection failed');

        alert('✓ Booking rejected and customer notified');
        closeRejectModal();
        loadPendingBookings();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // Auto-refresh every 30 seconds
    setInterval(() => {
      if (authToken) {
        loadPendingBookings();
        if (document.getElementById('calendar').classList.contains('active')) {
          loadAllBookings();
          renderCalendarView();
        }
      }
    }, 30000);
  </script>
</body>
</html>
